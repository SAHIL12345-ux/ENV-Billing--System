{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Invoice</title>

    <link rel="stylesheet"
          href="{% static 'invoices/style.css' %}">

</head>

<body>

    <nav>

        <h2>ENV Billing</h2>

        <div>

            <a href="{% url 'home' %}">Home</a>

            <a href="{% url 'invoice_list' %}">
                Invoices
            </a>

        </div>

    </nav>


    <div class="delete-container">

        <h1>Delete Invoice</h1>

        <p>
            Are you sure you want to delete this invoice?
        </p>

        <h3>
            Invoice: {{ invoice.invoice_number }}
        </h3>

        <p>
            Customer: {{ invoice.customer_name }}
        </p>

        <p>
            Amount: ₹{{ invoice.amount }}
        </p>


        <form method="POST">

            {% csrf_token %}

            <button type="submit"
                    class="delete-confirm-btn">

                Yes, Delete

            </button>

            <a href="{% url 'invoice_list' %}"
               class="btn secondary">

                Cancel

            </a>

        </form>

    </div>


    <footer>

        <p>© 2026 ENV Billing System</p>

    </footer>

</body>

</html>
